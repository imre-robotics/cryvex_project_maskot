# Nav2 Keepout Filter maskesi - masalarin GERCEK govde/tabla izdusumunu
# isaretler (malzeme listesi rev.4 bolum 5: "Masa tablolari ve tezgah
# cikintilari [LiDAR ile] gorunmez" uyarisi icin). cafe_map.yaml ile AYNI
# cozunurluk/origin/boyut - piksel piksel hizali.
#
# 8 masa merkezi patrol.py WAYPOINTS yorumlarindaki gercek koordinatlardan
# (table_0..table_7) alindi, her biri etrafinda 0.8x0.8 m (TABLE_HALF_M=0.40)
# kare isgalli bolge cizildi - GERCEK masa olculeri belli olunca bu dizindeki
# make_masks.py duzenlenip calistirilarak yeniden uretilebilir.
image: keepout_mask.pgm
mode: trinary
resolution: 0.05
origin: [-8.49, -7.3, 0]
negate: 0
occupied_thresh: 0.65
free_thresh: 0.25
