# Nav2 Speed Filter maskesi - kapi (DOOR_POS) ve barmen/mutfak (BARISTA_POS)
# cevresinde yavaslama alani (malzeme listesi rev.4 bolum 6, Asama 2:
# "speed filter (kapi ve mutfak onu)"). cafe_map.yaml ile AYNI cozunurluk/
# origin/boyut. mode=scale (trinary DEGIL) - suzuk deger lazim, sadece
# isgalli/serbest degil.
#
# Piksel 254 (beyaz) = kisitlama yok, 140 (orta gri) = kapi/barmen
# cevresi. costmap_filter_info_server'daki base/multiplier bu OccupancyGrid
# degerini gercek hiz yuzdesine cevirir (bkz. nav2_params.yaml
# speed_filter_info bolumu) - yaklasik %45 hiza denk gelecek sekilde
# ayarlandi, SAHADA test edilip ince ayar yapilmali (doc'un kendi genel
# tavsiyesi: "sahada olcun").
image: speed_mask.pgm
mode: scale
resolution: 0.05
origin: [-8.49, -7.3, 0]
negate: 0
occupied_thresh: 0.65
free_thresh: 0.25
