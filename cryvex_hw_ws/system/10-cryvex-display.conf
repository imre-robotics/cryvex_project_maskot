# Pi5'te iki DRM node'u var (v3d = GPU render-only, digeri = gercek HDMI
# KMS cikisi) ve Xorg'un otomatik-algilama sirasinda ikisi arasinda kafasi
# karisip "Cannot run in framebuffer mode" hatasiyla cokuyor - bu dosya
# dogru cihazi acikca sabitliyor. Baska bir Pi'de card numarasi farkli
# olabilir, once dogrulayin:
#   for f in /sys/class/drm/card*-*/status; do echo "$f: $(cat $f)"; done
# "connected" yazan satirdaki card numarasini asagiya yazin (ornegin
# "card1-HDMI-A-1: connected" ise kmsdev = /dev/dri/card1).
Section "Device"
    Identifier "Cryvex-Display"
    Driver "modesetting"
    Option "kmsdev" "/dev/dri/card1"
EndSection

Section "Screen"
    Identifier "Cryvex-Screen"
    Device "Cryvex-Display"
EndSection
